name: Daily research radar

on:
  workflow_dispatch:
  schedule:
    # 07:17 Asia/Shanghai on the following calendar day.
    - cron: '17 23 * * *'

permissions: {}

concurrency:
  group: research-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
      - name: Collect today's projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run update
      - name: Save the snapshot for the next run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- public/data/latest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh research radar"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the radar
        id: deployment
        uses: actions/deploy-pages@v4
